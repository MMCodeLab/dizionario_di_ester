<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Dizionario di Ester</title>
<meta name="description" content="Il dizionario personale delle parole inventate da Ester.">
<meta name="theme-color" content="#5c1a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diz. di Ester">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <!-- ============ COPERTINA ============ -->
  <section id="cover" class="cover">
    <div class="cover-vignette"></div>
    <div class="cover-book">
      <div class="cover-glow"></div>
      <img class="cover-logo" src="Logo_Ester.png" alt="Dizionario di Ester">
      <p class="cover-kicker">Edizione unica &middot; parole inventate</p>
      <button id="openBookBtn" class="btn-open" type="button">
        <span>Apri il Dizionario</span>
      </button>
    </div>
  </section>

  <!-- ============ BIBLIOTECA (app principale) ============ -->
  <div id="library" class="library hidden">

    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="Logo_Ester.png" alt="">
        <div class="brand-text">
          <span class="brand-title">Dizionario&nbsp;di&nbsp;Ester</span>
          <span class="brand-sub" id="wordCount">0 parole</span>
        </div>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="16.2" y1="16.2" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Cerca una parola&hellip;" autocomplete="off" spellcheck="false">
        <button id="searchClear" class="search-clear hidden" type="button" aria-label="Cancella ricerca">&times;</button>
        <div id="searchResults" class="search-results hidden"></div>
      </div>

      <button id="addWordBtn" class="btn-add" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span>Nuova parola</span>
      </button>
    </header>

    <main class="book-stage">
      <nav class="thumb-index" id="thumbIndex" aria-label="Indice alfabetico"></nav>

      <div class="book-wrap">
        <div class="book" id="book">
          <div class="book-cover-edge left-edge"></div>
          <div class="book-cover-edge right-edge"></div>

          <div class="page-spread" id="pageSpread">
            <section class="page page-left" id="pageLeft"></section>
            <div class="spine"></div>
            <section class="page page-right" id="pageRight"></section>
          </div>

          <div class="flip-page" id="flipPage" aria-hidden="true">
            <div class="flip-face flip-front"></div>
            <div class="flip-face flip-back"></div>
          </div>
        </div>

        <div class="book-nav">
          <button id="prevBtn" class="nav-btn" type="button" aria-label="Pagina precedente">&#8249;</button>
          <span id="pageIndicator" class="page-indicator">&mdash;</span>
          <button id="nextBtn" class="nav-btn" type="button" aria-label="Pagina successiva">&#8250;</button>
        </div>
      </div>
    </main>
  </div>

</div>

<!-- ============ MODALE AGGIUNGI / MODIFICA ============ -->
<div id="modalOverlay" class="modal-overlay hidden">
  <form id="wordForm" class="word-card" novalidate>
    <button type="button" class="card-close" id="closeModalBtn" aria-label="Chiudi">&times;</button>
    <p class="card-kicker" id="cardKicker">Nuova voce</p>
    <h2 class="card-title">
      <input id="fieldWord" class="input-word" type="text" placeholder="parola&hellip;" maxlength="60" required autocomplete="off">
    </h2>

    <div class="field-row">
      <label class="field-label" for="fieldTipo">Tipo</label>
      <select id="fieldTipo" class="input-select">
        <option value="">&mdash; nessuno &mdash;</option>
        <option value="sostantivo">sostantivo</option>
        <option value="verbo">verbo</option>
        <option value="aggettivo">aggettivo</option>
        <option value="avverbio">avverbio</option>
        <option value="esclamazione">esclamazione</option>
        <option value="altro">altro</option>
      </select>
    </div>

    <label class="field-label" for="fieldDef">Definizione</label>
    <textarea id="fieldDef" class="input-textarea" rows="3" placeholder="Cosa significa questa parola?" required></textarea>

    <label class="field-label" for="fieldEsempio">Esempio d'uso <em>(facoltativo)</em></label>
    <textarea id="fieldEsempio" class="input-textarea" rows="2" placeholder="Usala in una frase&hellip;"></textarea>

    <div class="card-actions">
      <button type="button" id="deleteWordBtn" class="btn-text btn-danger hidden">Elimina</button>
      <div class="spacer"></div>
      <button type="button" id="cancelWordBtn" class="btn-text">Annulla</button>
      <button type="submit" class="btn-save">Salva parola</button>
    </div>
  </form>
</div>

<div id="confirmOverlay" class="modal-overlay hidden">
  <div class="confirm-card">
    <p id="confirmText">Eliminare questa parola?</p>
    <div class="card-actions">
      <div class="spacer"></div>
      <button type="button" id="confirmCancelBtn" class="btn-text">Annulla</button>
      <button type="button" id="confirmOkBtn" class="btn-save btn-danger-solid">Elimina</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/storage.js"></script>
<script src="js/book.js"></script>
<script src="js/app.js"></script>
</body>
</html>
